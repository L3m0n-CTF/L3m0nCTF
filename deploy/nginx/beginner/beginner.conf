# The beginner site: beginner.<domain>, the lessons, practice files and live labs of the Beginners Section (26 Nov 2026, deploy/beginner/, docs/runbooks/21-beginner-section.md).
#
# This file is in the nginx container ONLY when the `beginner` overlay is on: that overlay mounts it at /etc/nginx/instances.d/beginner.conf, and
# templates-production/platform.conf.template includes /etc/nginx/instances.d/*.conf (a folder that holds nothing otherwise). It is a server block of its own, not part of
# the platform's, so none of the platform's rules (or CTFd) apply to it and none of its rules apply to the platform.
#
# Who may connect: only Cloudflare, exactly as for the platform (the client certificate is checked in the TLS handshake). The platform's names (play., crew.) are exact names in
# the platform's block and win over this one; the instances' names (32 hex characters and a dot) are another block. This one answers only the exact name
# beginner.l3m0nctf.xyz (anchored at both ends: Cloudflare's origin-pull certificate is shared by all of its customers, so a name that merely STARTS with `beginner.` on
# somebody else's zone must not reach this container). A different domain means editing the one `server_name` line below.
#
# The upstream is looked up AT REQUEST TIME (a variable in proxy_pass and Docker's own resolver), not when nginx starts: if the beginner container is down or not yet there,
# only this host answers 502, and nginx itself, with the platform, starts and runs as always. (An `upstream` block would stop nginx from starting at all.)

server {
  listen 8443 ssl;
  # no HTTP/2 and TLS 1.2 only, as in the platform's block (docs/security/dependency-bumps.md: the nginx advisories of 19 Nov 2026)
  server_name "~^beginner\.l3m0nctf\.xyz$";

  # the same TLS settings as the platform's block (tools/tests/test_beginner_overlay.py keeps them equal)
  ssl_certificate         /etc/nginx/tls/origin.pem;
  ssl_certificate_key     /etc/nginx/tls/origin.key;
  ssl_client_certificate  /etc/nginx/tls/cloudflare-origin-pull-ca.pem;
  ssl_verify_client       on;
  ssl_protocols           TLSv1.2;
  ssl_prefer_server_ciphers off;
  ssl_session_cache       shared:SSL:10m;
  ssl_session_timeout     1h;
  ssl_session_tickets     off;

  include /etc/nginx/snippets/security-headers.conf;

  # the limits per visitor address and the request size (the zones are defined in nginx.conf); the lessons are small pages, the biggest answer is a practice file
  limit_req zone=general burst=100 nodelay;
  limit_conn perip 100;
  client_max_body_size 16k;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $beginner_upstream http://beginner:8000;

  location / {
    proxy_pass $beginner_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # the visitor's address as nginx resolved it (the Cloudflare header, only from Cloudflare); never "add to" what the visitor sent
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 20s;
  }

  # the lesson's flag checker: the same limit per address as the platform's flag submissions
  location = /api/flag {
    limit_req zone=flags burst=30 nodelay;
    proxy_pass $beginner_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }
}
