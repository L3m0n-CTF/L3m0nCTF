# The crew-only gate's list of routes: the ONE place it is written (docs/runbooks/15-rehearsal.md).
#
# nginx.conf includes this file inside `map $uri $programme_route { ... }`. While the gate is closed (snippets/crew-only.conf says `default 1;`), a visitor who is
# not the crew gets the "not on air yet" answer for every request that matches a line here; everything else (registration, sign-in, the player's own
# settings and studio, the health routes, static files) is untouched.
#
# A new page or API route that shows programmes, scores, flags, a studio's solves or the story MUST be added here. tools/tests/test_gate_routes.py reads this
# file, reads every route the plugins register, and fails until each one has a recorded decision (gated / open / crew), so a route cannot be forgotten.
#
# Each line is a regular expression on the path, written the way nginx reads a map entry (`~` is case-sensitive; `\z` is the end of the text).
default 0;
# the pages: the board (channels), the Guide, the scoreboard, the challenges, the story pages
"~^/(board|guide|scoreboard|challenges|stories)(/|\z)" 1;
"~^/story(/|\z)" 1;
# a studio's public page shows its solves (/teams/new, /teams/join and /teams/invite are registration steps and stay open: only a number after /teams/ is a studio)
"~^/teams/[0-9]+(/|\z)" 1;
"~^/files/" 1;
# the data behind them
"~^/api/v1/(challenges|hints|unlocks|solutions|scoreboard|statistics|awards|submissions|files)(/|\z)" 1;
"~^/api/v1/l3mon/(board|guide|scoreboard|instances|story)(/|\z)" 1;
"~^/api/v1/(users|teams)/[^/]+/(solves|awards|fails|submissions)\z" 1;
