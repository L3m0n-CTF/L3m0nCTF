# Headers for every answer of the verification portal (deploy/nginx/verify/verify.conf). Included in every location there, because nginx drops
# inherited add_header lines as soon as a location sets one of its own.
# The portal's pages are all generated by tools/l3mon/verify/site.py: no inline script, no inline style, no third-party anything, so the
# Content-Security-Policy can be strict (tools/tests/test_verify_site.py checks the pages stay that way).
include /etc/nginx/snippets/security-headers.conf;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
