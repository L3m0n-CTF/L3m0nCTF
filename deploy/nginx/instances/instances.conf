# The web addresses of challenge instances: <32 hex>.<instance domain>, for example 0123456789abcdef0123456789abcdef.l3m0nctf.xyz
# (docs/deploy/instancer-traffic.md; the wildcard record *.l3m0nctf.xyz is proxied by Cloudflare, whose free certificate covers exactly one level).
#
# This file is in the nginx container ONLY when the `instancer-central` overlay is on: that overlay mounts it at /etc/nginx/instances.d/instances.conf, and
# templates-production/platform.conf.template includes /etc/nginx/instances.d/*.conf (a folder that holds nothing otherwise, so nothing changes for a platform
# without a challenge host). It is a block of its own, not part of the platform's server block, so none of the platform's rules (or CTFd) apply to it.
#
# The path of a request: player -> Cloudflare -> this block -> the central router (hop 1, on this machine) -> the router of the challenge host (hop 2) -> the container.
# Who may connect: only Cloudflare, exactly as for the platform (the client certificate is checked in the TLS handshake). The platform's names (play., crew.)
# are exact names in the platform's block and win over this one; this one answers only a name that starts with 32 hex characters and a dot. The router
# then checks the rest of the name against INSTANCE_DOMAIN and answers 404 for any other domain.

upstream instance_router {
  server router:8090;
  keepalive 16;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name "~^[0-9a-f]{32}\.";

  # the same TLS settings as the platform's block (tools/tests/test_instancer_central.py keeps the two equal)
  ssl_certificate         /etc/nginx/tls/origin.pem;
  ssl_certificate_key     /etc/nginx/tls/origin.key;
  ssl_client_certificate  /etc/nginx/tls/cloudflare-origin-pull-ca.pem;
  ssl_verify_client       on;
  ssl_protocols           TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache       shared:SSL:10m;
  ssl_session_timeout     1h;
  ssl_session_tickets     off;

  # the limits per visitor address and the request size (the zones are defined in nginx.conf)
  limit_req zone=general burst=200 nodelay;
  limit_conn perip 300;
  client_max_body_size 8m;

  location / {
    proxy_pass http://instance_router;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # the router reads <id>.<domain> from the Host header to find the instance
    proxy_set_header Host $host;
    # the visitor's address as nginx resolved it (the Cloudflare header, only from Cloudflare); never "add to" what the visitor sent
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
    # A challenge keeps its own cookies; what is closed is a Domain attribute for the whole zone: it would plant a cookie that the browser also sends to the
    # platform (cookie shadowing). Every Domain attribute becomes the instance's own host name, which makes the cookie host-only.
    proxy_cookie_domain ~^.+$ $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
  }
}
